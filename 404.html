<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('we-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | 无误差</title>
<meta name="robots" content="noindex">
<style>
  /* 404 用内联样式：GitHub Pages 的 404 会在任意层级的 URL 上渲染，
     相对路径的 CSS 可能取不到，所以这里不依赖外部文件。 */
  :root{ --ink:#0B0B0C; --paper:#FAFAF8; --muted:#6B6B70; --accent:#39D353; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#F2F2F0; --paper:#111112; --muted:#9A9AA0; } }
  :root[data-theme="light"]{ --ink:#0B0B0C; --paper:#FAFAF8; --muted:#6B6B70; }
  :root[data-theme="dark"]{ --ink:#F2F2F0; --paper:#111112; --muted:#9A9AA0; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
    line-height:1.7; text-align:center;
  }
  .box{ max-width:520px; }
  .term{
    background:#0B0B0C; border:1px solid #232326; border-radius:6px;
    padding:18px 20px; text-align:left; margin-bottom:28px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; line-height:1.9;
    color:#D6D6D8; overflow-wrap:anywhere;
  }
  .ps{ color:#7A7A82; }
  .err{ color:#F2F2F0; }
  h1{ font-size:20px; margin:0 0 8px; letter-spacing:.01em; }
  p{ margin:0 0 22px; color:var(--muted); font-size:14.5px; }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ text-decoration:underline; text-underline-offset:3px; }
  .stamp{
    display:inline-block; transform:rotate(-3deg); margin-bottom:22px;
    border:2px solid var(--accent); color:var(--accent);
    font-family:ui-monospace,Menlo,monospace; font-weight:700;
    font-size:13px; letter-spacing:.18em; padding:6px 10px; border-radius:2px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="stamp">0&nbsp;ERROR</div>

    <div class="term">
      <div><span class="ps">no-errors@wuwucha:~$</span> cat 你找的页面</div>
      <div class="err">cat: 你找的页面: No such file or directory</div>
      <div><span class="ps">no-errors@wuwucha:~$</span> █</div>
    </div>

    <h1>这个页面不存在</h1>
    <p>可能是链接写错了，也可能是它还在我脑子里，没写到硬盘上。</p>
    <!-- 如果你是「用户主页」仓库（用户名.github.io），下面这个 / 就是对的。
         如果放在「项目仓库」（用户名.github.io/仓库名），把 / 改成 /仓库名/ 。 -->
    <p><a href="/">← 回首页</a></p>
  </div>
</body>
</html>
